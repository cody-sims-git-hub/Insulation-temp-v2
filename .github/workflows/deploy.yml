# =============================================================================
#  Cloudflare Workers Static Assets deploy — GitHub Actions
#  SDP standard for static sites (sdp-starter-kit → operations/deploy-placement).
#  Serves dist/ from Cloudflare's edge on the Custom Domain in wrangler.jsonc
#  (insulation-demo-2.simsdigitalpartners.com); `wrangler deploy` also creates that domain's DNS
#  record + certificate. Every deploy is atomic, so there's no cache to purge.
#
#  Requires ONE repo secret: CLOUDFLARE_WORKERS_TOKEN — an API token with
#  Account · Workers Scripts: Edit and Zone (simsdigitalpartners.com) · Workers
#  Routes: Edit. Optional repo Variable CLOUDFLARE_ACCOUNT_ID, needed only if
#  that token can see more than one account.
# =============================================================================
name: Deploy to Cloudflare
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gates — runs on PRs AND main pushes.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Validates wrangler.jsonc, _headers and the asset bundle without
      # uploading anything (needs no Cloudflare credentials).
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run
      - run: npm audit --omit=dev --audit-level=critical

  # Build + publish to Cloudflare — main push ONLY, never PRs or branches.
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build site
        run: npm run build
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Only pass an account when one is configured; otherwise Wrangler
          # uses the single account the token can access.
          if [ -n "$ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"; fi
          npx wrangler deploy
      # Smoke test: the live domain answers and carries the noindex header. A
      # warning, not a failure: on the very first deploy the new certificate can
      # take a few minutes to issue even though the deploy itself succeeded.
      - name: Smoke test insulation-demo-2.simsdigitalpartners.com
        continue-on-error: true
        run: |
          for attempt in 1 2 3 4 5 6; do
            headers="$(curl -sS -D- -o /dev/null https://insulation-demo-2.simsdigitalpartners.com/ || true)"
            if printf '%s' "$headers" | head -n1 | grep -q ' 200' \
               && printf '%s' "$headers" | grep -qi '^x-robots-tag: .*noindex'; then
              echo "https://insulation-demo-2.simsdigitalpartners.com/ is live and noindexed."; exit 0
            fi
            sleep 20
          done
          echo "::warning::https://insulation-demo-2.simsdigitalpartners.com/ did not return 200 + X-Robots-Tag: noindex yet — check it by hand."
          exit 1
